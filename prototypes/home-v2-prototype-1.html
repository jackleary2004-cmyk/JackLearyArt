<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jack Leary — Home Prototype v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@100;300;900&display=swap" rel="stylesheet">
<style>
  /*
    PROTOTYPE NOTES (read me first):

    "New Website 2" — a full restart on visual direction per your new style
    guide (black bg, sharp corners, red/yellow/blue accents, Neue Haas
    Grotesk Pro). This is a NEW file, separate from prototypes/intro-
    prototype.html (the falling-images piece) — nothing there has been
    touched. Once this direction is approved this will fully replace it,
    but I'm leaving the old one alone until you say so.

    This first pass only covers what you've described so far: the top nav,
    the big glitching "JACK LEARY" name, and the bio text box beneath it.
    Send the rest of the Home Page (and any other pages) whenever you're
    ready and I'll build straight into this same file.

    FONT — "Neue Haas Grotesk Pro" isn't a free/Google font (same
    unresolved situation as every other prototype so far). Standing in
    with "Archivo" here instead of Helvetica: it's a true variable font
    with both a Thin 100 (body/nav) and a Black 900 (headers) cut, and
    reads much closer to Neue Haas's grotesque personality than Helvetica
    does. Swap the Google Fonts import + the two --font-* vars below
    once real Neue Haas files are available.

    HOVER NOISE — the flowing red/yellow/blue text-hover effect is built
    by animating a gradient behind the text (background-clip: text) and
    layering a generated SVG turbulence pattern on top via
    background-blend-mode, rather than a canvas/WebGL grain — cheap, and
    still reads as "noisy" texture moving through the color sweep.

    NAV HOVER COLORS — WORK/CONTACT/ARCHIVE each got one of the three
    accent colors assigned (red/yellow/blue) so all three colors show up
    somewhere on first load — tell me if you want a different mapping.
  */

  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --black:  #000000;
    --white:  #ffffff;
    --red:    #eb1c1c;
    --yellow: #f0e100;
    --blue:   #48acf0;

    --side-pad: clamp(24px, 6vw, 100px);

    --font-header: "Archivo", "Helvetica Neue", Arial, sans-serif;
    --font-body:   "Archivo", "Helvetica Neue", Arial, sans-serif;
  }

  html, body {
    background: var(--black);
    color: var(--white);
    font-family: var(--font-body);
    font-weight: 100;
    overflow-x: hidden;
  }

  /* Sharp corners everywhere — no rounded edges anywhere in this design. */
  * { border-radius: 0 !important; }

  a { color: inherit; text-decoration: none; }

  /* ---------- NAV ---------- */

  .nav {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: clamp(20px, 4vh, 40px) var(--side-pad) 0;
    z-index: 10;
  }

  .nav a {
    font-family: var(--font-body);
    font-weight: 100;
    font-size: clamp(12px, 1.4vw, 15px);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    opacity: 0;
    transform: translateY(-8px);
    animation: navIn 0.6s ease forwards;
    transition: color 0.4s ease, transform 0.4s ease;
  }
  .nav a:hover {
    transform: translateY(-4px) scale(1.08);
  }
  .nav a:nth-child(1) { animation-delay: 0.45s; } /* WORK — appears last (rightmost fires first) */
  .nav a:nth-child(2) { animation-delay: 0.225s; } /* CONTACT */
  .nav a:nth-child(3) { animation-delay: 0s; }     /* ARCHIVE — appears first */

  .nav a.hover-red:hover    { color: var(--red); }
  .nav a.hover-yellow:hover { color: var(--yellow); }
  .nav a.hover-blue:hover   { color: var(--blue); }

  @keyframes navIn {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ---------- HERO ---------- */

  .hero {
    position: relative;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(2rem, 5vh, 3.5rem);
    padding: 12vh var(--side-pad) 8vh;
  }

  .hero-name {
    width: 100%;
    overflow: hidden;
    line-height: 0.86;
    text-align: center;
  }

  .hero-name .stretch {
    display: inline-block;
    white-space: nowrap;
    transform-origin: center top;
    font-family: var(--font-header);
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: -0.01em;
    font-size: clamp(3.2rem, 15vw, 11.5rem);
    color: var(--white);
    cursor: default;

    /* Hover state fades in an animated color sweep + noise texture,
       clipped to the letterforms themselves. */
    background-image:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/></svg>"),
      linear-gradient(90deg, var(--red), var(--yellow), var(--blue), var(--red));
    background-size: 160px 160px, 300% 100%;
    background-position: 0 0, 0% 0;
    background-blend-mode: overlay, normal;
    -webkit-background-clip: text;
    background-clip: text;
    color: var(--white);
    transition: color 0.3s ease;
  }

  .hero-name:hover .stretch {
    color: transparent;
    -webkit-text-fill-color: transparent; /* Safari needs this alongside background-clip:text */
    animation: nameFlow 3.5s linear infinite;
  }

  @keyframes nameFlow {
    0%   { background-position: 0 0, 0% 0; }
    100% { background-position: 160px 160px, 300% 0; }
  }

  /* ---------- BIO BOX ---------- */

  .bio-box {
    max-width: 640px;
    width: 100%;
    border: 1px solid var(--white);
    padding: clamp(1.5rem, 3vw, 2.5rem);
  }

  .bio-box p {
    font-family: var(--font-body);
    font-weight: 100;
    font-size: clamp(0.95rem, 1.3vw, 1.1rem);
    line-height: 1.65;
    text-align: justify;
    color: var(--white);
  }

  /* ---------- MOBILE ---------- */

  @media (max-width: 700px) {
    .hero-name .line { display: block; }
    .nav { padding-top: 20px; }
    .nav a { font-size: 11px; letter-spacing: 0.12em; }
  }
</style>
</head>
<body>

  <nav class="nav">
    <a href="#work" class="hover-red">Work</a>
    <a href="#contact" class="hover-yellow">Contact</a>
    <a href="#archive" class="hover-blue">Archive</a>
  </nav>

  <header class="hero">
    <h1 class="hero-name">
      <span class="stretch" id="stretch-name">
        <span class="line">JACK</span><span class="line" style="display:inline">&nbsp;LEARY</span>
      </span>
    </h1>

    <div class="bio-box">
      <p>
        I am a multidisciplinary designer focusing on brand design and poster
        design. I am based in Los Angeles, California and draw my inspiration
        from the world around me, the people in my life, and the blend of
        past/present/and future design themes.
      </p>
    </div>
  </header>

<script>
(function () {
  // ---- Name: stretch to fill the full padded width -----------------------
  // Same "measure natural width, scaleX up to container width" trick used
  // elsewhere on the site, so the name always spans edge-to-edge no matter
  // the viewport. On mobile the two <span class="line"> words stack (see
  // the media query) and each one gets measured/stretched independently.
  const heroName = document.querySelector(".hero-name");
  const stretchEl = document.getElementById("stretch-name");
  const lineEls = stretchEl.querySelectorAll(".line");

  function isMobile() {
    return window.matchMedia("(max-width: 700px)").matches;
  }

  function fitHeroName() {
    const containerWidth = heroName.clientWidth;

    if (isMobile()) {
      stretchEl.style.transform = "none";
      lineEls.forEach((line) => {
        line.style.transform = "none";
        line.style.transformOrigin = "center top";
        const natural = line.getBoundingClientRect().width;
        if (natural > 0) {
          line.style.transform = `scaleX(${containerWidth / natural})`;
        }
      });
    } else {
      lineEls.forEach((line) => { line.style.transform = "none"; });
      stretchEl.style.transform = "none";
      const natural = stretchEl.getBoundingClientRect().width;
      if (natural > 0) {
        stretchEl.style.transform = `scaleX(${containerWidth / natural})`;
      }
    }
  }

  window.addEventListener("resize", fitHeroName);
  fitHeroName();
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(fitHeroName);
  }
})();
</script>
</body>
</html>
